<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveStock AI - Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg-dark: #0a0f0a;
      --accent-green: #4ec850;
      --accent-lime: #a8e050;
      --panel-light: #f7faf7;
      --text-main: #333333;
      --text-muted: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
    }

    /* 3D Background */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.25;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(30, 60, 30, 0.2) 0%, rgba(10, 15, 10, 0.9) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Layout */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px;
    }

    .card {
      display: flex;
      width: 100%;
      max-width: 900px;
      height: 560px;
      background: transparent;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(80, 160, 80, 0.18);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7);
    }

    /* Left Panel */
    .left-panel {
      flex: 1;
      position: relative;
      background: linear-gradient(135deg, #0f1c10 0%, #0a0f0a 100%);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(78, 200, 80, 0.15) 0%, transparent 70%);
      animation: pulseOrb 4s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; bottom: -150px; right: -150px; animation-delay: 2s; }

    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .pulse-ring {
      position: absolute;
      border: 1px solid rgba(78, 200, 80, 0.2);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseRing 3s ease-out infinite;
      pointer-events: none;
    }
    .ring-1 { width: 300px; height: 300px; animation-delay: 0s; }
    .ring-2 { width: 450px; height: 450px; animation-delay: 1.5s; }

    @keyframes pulseRing {
      0% { width: 100px; height: 100px; opacity: 1; }
      100% { width: 600px; height: 600px; opacity: 0; }
    }

    .floating-emojis {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .emoji {
      position: absolute;
      font-size: 24px;
      bottom: -30px;
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-400px) scale(1.2) rotate(20deg); opacity: 0; }
    }

    .brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: floatBrand 3s ease-in-out infinite;
    }

    @keyframes floatBrand {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: var(--accent-green);
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      box-shadow: 0 8px 16px rgba(78, 200, 80, 0.3);
    }

    .brand-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      margin-top: auto;
      margin-bottom: auto;
    }

    .tag-badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(78, 200, 80, 0.15);
      border: 1px solid rgba(78, 200, 80, 0.3);
      border-radius: 30px;
      color: var(--accent-green);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 20px;
      backdrop-filter: blur(4px);
    }

    .hero-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 38px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .hero-title span {
      color: var(--accent-green);
    }

    .hero-subtitle {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      max-width: 90%;
    }

    .stats {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Right Panel */
    .right-panel {
      flex: 1;
      background: var(--panel-light);
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .form-header {
      margin-bottom: 32px;
    }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-subtitle a {
      color: var(--accent-green);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .form-subtitle a:hover {
      color: #3ba83d;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: #999;
      transition: fill 0.2s;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 48px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 0 16px 0 48px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text-main);
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 4px rgba(78, 200, 80, 0.15);
    }

    .form-input:focus + .input-icon {
      fill: var(--accent-green);
    }

    .form-options {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
      margin-top: -8px;
    }

    .forgot-link {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: var(--accent-green);
    }

    .btn-main {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-lime) 100%);
      border: none;
      border-radius: 12px;
      color: #000;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(78, 200, 80, 0.3);
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(78, 200, 80, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: #999;
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }

    .divider::before { margin-right: 12px; }
    .divider::after { margin-left: 12px; }

    .btn-google {
      width: 100%;
      height: 48px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-google:hover {
      background: #f0f0f0;
    }

    @media (max-width: 768px) {
      .card {
        flex-direction: column;
        height: auto;
        max-height: 90vh;
        overflow-y: auto;
      }
      .left-panel, .right-panel {
        padding: 30px;
      }
      .stats {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 3D Three.js Container -->
  <div id="canvas-container"></div>
  
  <!-- Overlay Gradient -->
  <div class="bg-overlay"></div>

  <!-- Main Content -->
  <div class="container">
    <div class="card">
      
      <!-- Left Branding Panel -->
      <div class="left-panel">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        
        <div class="pulse-ring ring-1"></div>
        <div class="pulse-ring ring-2"></div>

        <div class="floating-emojis" id="emojis"></div>

        <div class="brand">
          <div class="brand-logo">🐄</div>
          <div class="brand-text">LiveStock AI</div>
        </div>

        <div class="hero-content">
          <div class="tag-badge">AI-Powered Platform</div>
          <h1 class="hero-title">Predict. <span>Protect.</span> Prosper.</h1>
          <p class="hero-subtitle">Advanced machine learning to forecast livestock health, yields, and market outcomes with 94% accuracy.</p>
        </div>

        <div class="stats">
          <div class="stat-item">
            <span class="stat-value">12K+</span>
            <span class="stat-label">Farmers</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">94%</span>
            <span class="stat-label">Accuracy</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">3.2M</span>
            <span class="stat-label">Predictions</span>
          </div>
        </div>
      </div>

      <!-- Right Login Form Panel -->
      <div class="right-panel">
        <div class="form-header">
          <h2 class="form-title">Welcome back</h2>
          <p class="form-subtitle">Don't have an account? <a href="#">Sign up free</a></p>
        </div>

        <form>
          <!-- Email Field -->
          <div class="input-group">
            <input type="email" class="form-input" placeholder="Email address" required>
            <!-- Mail SVG -->
            <svg class="input-icon" viewBox="0 0 24 24">
              <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 18H4V8L12 13L20 8V18ZM12 11L4 6H20L12 11Z"/>
            </svg>
          </div>

          <!-- Password Field -->
          <div class="input-group">
            <input type="password" class="form-input" placeholder="Password" required>
            <!-- Lock SVG -->
            <svg class="input-icon" viewBox="0 0 24 24">
              <path d="M18 8H17V6C17 3.24 14.76 1 12 1C9.24 1 7 3.24 7 6V8H6C4.9 8 4 8.9 4 10V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V10C20 8.9 19.1 8 18 8ZM9 6C9 4.34 10.34 3 12 3C13.66 3 15 4.34 15 6V8H9V6ZM18 20H6V10H18V20ZM12 17C13.1 17 14 16.1 14 15C14 13.9 13.1 13 12 13C10.9 13 10 13.9 10 15C10 16.1 10.9 17 12 17Z"/>
            </svg>
          </div>

          <!-- Forgot Password -->
          <div class="form-options">
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <!-- CTA Button -->
          <button type="submit" class="btn-main">Sign in to Dashboard</button>

          <!-- Divider -->
          <div class="divider">or continue with</div>

          <!-- Google Button -->
          <button type="button" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.67 15.63 16.89 16.8 15.71 17.58V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"/>
              <path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.71 17.58C14.73 18.24 13.48 18.63 12 18.63C9.14 18.63 6.71 16.71 5.84 14.1H2.17V16.94C3.99 20.53 7.7 23 12 23Z" fill="#34A853"/>
              <path d="M5.84 14.1C5.62 13.44 5.49 12.74 5.49 12C5.49 11.26 5.62 10.56 5.84 9.9V7.06H2.17C1.43 8.53 1 10.22 1 12C1 13.78 1.43 15.47 2.17 16.94L5.84 14.1Z" fill="#FBBC05"/>
              <path d="M12 5.38C13.62 5.38 15.07 5.93 16.21 7.02L19.35 3.88C17.45 2.11 14.97 1 12 1C7.7 1 3.99 3.47 2.17 7.06L5.84 9.9C6.71 7.29 9.14 5.38 12 5.38Z" fill="#EA4335"/>
            </svg>
            Google
          </button>
        </form>
      </div>

    </div>
  </div>

  <!-- Load Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    /* =========================================
       1. Farm Emojis Animation
       ========================================= */
    const emojis = ['🐄', '🐑', '🌾', '🐖', '🌿'];
    const emojisContainer = document.getElementById('emojis');
    
    function createEmoji() {
      const el = document.createElement('div');
      el.classList.add('emoji');
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      // Random X position between 10% and 90%
      el.style.left = Math.random() * 80 + 10 + '%';
      // Random duration between 6s and 11s
      el.style.animationDuration = (Math.random() * 5 + 6) + 's'; 
      // Random stagger delay
      el.style.animationDelay = (Math.random() * 5) + 's';
      emojisContainer.appendChild(el);
      
      // Clean up and loop
      setTimeout(() => {
        el.remove();
        createEmoji();
      }, parseFloat(el.style.animationDuration) * 1000 + parseFloat(el.style.animationDelay) * 1000);
    }
    
    // Initialize multiple emojis
    for(let i=0; i<8; i++) {
      createEmoji();
    }

    /* =========================================
       2. Three.js 3D Background
       ========================================= */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2.1 Particles (2000 floating green particles)
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i++) {
      // Spread particles over roughly a 10x10 space
      posArray[i] = (Math.random() - 0.5) * 10;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.015,
      color: 0x4ec850,
      transparent: true,
      opacity: 0.8
    });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);

    // 2.2 Torus Rings (Wireframe)
    const torusGeom1 = new THREE.TorusGeometry(1.5, 0.015, 16, 100);
    const torusGeom2 = new THREE.TorusGeometry(2.2, 0.015, 16, 100);
    const wireMaterial = new THREE.MeshBasicMaterial({ 
      color: 0x4ec850, 
      wireframe: true, 
      transparent: true, 
      opacity: 0.25 
    });
    
    const torus1 = new THREE.Mesh(torusGeom1, wireMaterial);
    const torus2 = new THREE.Mesh(torusGeom2, wireMaterial);
    
    // Position rings slightly off-center
    torus1.position.set(-2, 1, -3);
    torus2.position.set(-2, 1, -4);
    
    torus1.rotation.x = Math.PI / 4;
    torus2.rotation.y = Math.PI / 3;
    
    scene.add(torus1);
    scene.add(torus2);

    // 2.3 Icosahedron (Bottom right geometry)
    const icoGeom = new THREE.IcosahedronGeometry(1.2, 0);
    const icosahedron = new THREE.Mesh(icoGeom, wireMaterial);
    icosahedron.position.set(2.5, -1.5, -3);
    scene.add(icosahedron);

    camera.position.z = 3;

    // 2.4 Mouse Parallax Effect
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    document.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX - windowHalfX);
      mouseY = (event.clientY - windowHalfY);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      
      const elapsedTime = clock.getElapsedTime();

      // Slow rotation for particles
      particlesMesh.rotation.y = elapsedTime * 0.05;
      
      // Rotate Torus 1
      torus1.rotation.y += 0.005;
      torus1.rotation.x += 0.002;
      
      // Rotate Torus 2
      torus2.rotation.y -= 0.003;
      torus2.rotation.z += 0.004;

      // Rotate Icosahedron
      icosahedron.rotation.x += 0.005;
      icosahedron.rotation.y += 0.005;

      // Smooth Parallax tracking
      targetX = mouseX * 0.001;
      targetY = mouseY * 0.001;
      
      camera.position.x += (targetX - camera.position.x) * 0.05;
      camera.position.y += (-targetY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }

    animate();

    // 2.5 Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
